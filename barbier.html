<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Agenda — Le Fade Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b0d;--bg2:#131316;--card:#18181c;--line:#26262c;--gold:#d4a84b;--gold2:#f3d48a;--text:#ececec;--muted:#9a9aa3;--green:#4ade80;--red:#f87171}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  h1,h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.04em}

  /* Connexion */
  .login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px;width:min(400px,100%);display:grid;gap:14px}
  .login h1{font-size:2.4rem}
  .login h1 span{color:var(--gold)}
  .login p{color:var(--muted);font-size:.9rem;margin-top:-8px}
  input{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:1rem}
  input:focus{outline:none;border-color:var(--gold)}
  .btn{padding:14px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-weight:600;font-size:1rem}
  .err{color:var(--red);font-size:.88rem;min-height:1.2em}

  /* Agenda */
  .app{display:none}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);background:rgba(11,11,13,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:1.8rem}
  header h1 span{color:var(--gold)}
  .live{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.6s infinite}
  .live.off i{background:var(--red);box-shadow:0 0 10px var(--red)}
  @keyframes blink{50%{opacity:.3}}
  .spacer{flex:1}
  .hbtn{padding:9px 14px;border-radius:50px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:.85rem}
  .hbtn:hover{border-color:var(--gold)}

  main{max-width:900px;margin:auto;padding:24px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .stat b{font-family:'Bebas Neue';font-size:2.4rem;color:var(--gold);display:block;line-height:1;font-weight:400}
  .stat small{color:var(--muted);font-size:.8rem}

  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}
  .day{flex:0 0 74px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:center;position:relative;transition:.2s}
  .day small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase}
  .day b{font-family:'Bebas Neue';font-size:1.6rem;font-weight:400;line-height:1.1}
  .day .n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#111;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
  .day.on{background:var(--gold);color:#111;border-color:var(--gold)}
  .day.on small{color:#111}
  .day.on .n{background:#111;color:var(--gold)}

  .day-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .day-title h2{font-size:2rem}
  .day-title span{color:var(--muted);font-size:.9rem}

  .list{display:grid;gap:12px}
  .empty{color:var(--muted);text-align:center;padding:50px 20px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
  .rdv{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:18px;animation:in .4s cubic-bezier(.3,1.4,.5,1)}
  .rdv.new{animation:in .4s cubic-bezier(.3,1.4,.5,1),flash 1s 3}
  .rdv.terminee{border-left-color:var(--green);opacity:.6}
  .rdv.absent{border-left-color:var(--red);opacity:.6}
  .rdv.next{box-shadow:0 0 0 1px var(--gold)}
  @keyframes in{from{opacity:0;transform:scale(.95)}}
  @keyframes flash{50%{box-shadow:0 0 0 3px var(--gold)}}
  .time{font-family:'Bebas Neue';font-size:2.2rem;line-height:1;color:var(--gold)}
  .time small{display:block;font-family:'Inter';font-size:.75rem;color:var(--muted)}
  .who b{font-size:1.05rem;display:block}
  .who .svc{color:var(--muted);font-size:.88rem}
  .who a{color:var(--text);font-size:.88rem}
  .badge{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:50px;margin-left:6px;vertical-align:middle}
  .badge.terminee{background:rgba(74,222,128,.15);color:var(--green)}
  .badge.absent{background:rgba(248,113,113,.15);color:var(--red)}
  .badge.next{background:rgba(212,168,75,.15);color:var(--gold)}
  .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .act{padding:8px 12px;border-radius:50px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:.8rem;transition:.2s}
  .act.done:hover{border-color:var(--green);color:var(--green)}
  .act.abs:hover{border-color:var(--red);color:var(--red)}
  .act.del:hover,.act.del.sure{border-color:var(--red);color:#fff;background:var(--red)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;padding:14px 24px;border-radius:50px;font-weight:600;transition:transform .4s cubic-bezier(.3,1.4,.5,1);z-index:20;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}

  @media (max-width:640px){
    .rdv{grid-template-columns:70px 1fr}
    .actions{grid-column:1/-1;justify-content:flex-start}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{padding:12px}.stat b{font-size:1.8rem}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <form id="login-form">
    <h1>LE FADE <span>CLUB</span></h1>
    <p>Agenda du barbier — accès réservé</p>
    <input type="email" id="email" placeholder="Courriel" required autocomplete="username">
    <input type="password" id="pass" placeholder="Mot de passe" required autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn" type="submit">Se connecter</button>
  </form>
</div>

<div class="app" id="app">
  <header>
    <h1>LE FADE <span>CLUB</span> · Agenda</h1>
    <span class="live" id="live"><i></i><span>En direct</span></span>
    <span class="spacer"></span>
    <button class="hbtn" id="sound">🔔 Son activé</button>
    <button class="hbtn" id="logout">Déconnexion</button>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="s-today">0</b><small>RDV aujourd'hui</small></div>
      <div class="stat"><b id="s-money">0 $</b><small>Prévu aujourd'hui</small></div>
      <div class="stat"><b id="s-week">0</b><small>RDV à venir (14 jours)</small></div>
    </div>
    <div class="days" id="days"></div>
    <div class="day-title"><h2 id="day-name"></h2><span id="day-count"></span></div>
    <div class="list" id="list"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDQLlnQZha6r-g--XDKpMporYUmXtuZOqA",
    authDomain: "fade-club-bfa98.firebaseapp.com",
    projectId: "fade-club-bfa98",
    storageBucket: "fade-club-bfa98.firebasestorage.app",
    messagingSenderId: "230961705953",
    appId: "1:230961705953:web:0c584f08b5c8de3f21d8a0"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const JOURS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const SCHEDULE = {0:[11,16],1:null,2:[10,19],3:[10,19],4:[10,21],5:[10,21],6:[9,18]};

  /* ---------- Connexion ---------- */
  $('#login-form').onsubmit = async e => {
    e.preventDefault(); $('#err').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#pass').value); }
    catch { $('#err').textContent = 'Courriel ou mot de passe incorrect.'; }
  };
  $('#logout').onclick = () => signOut(auth);
  let unsub = null;
  onAuthStateChanged(auth, user => {
    $('#login').style.display = user ? 'none' : 'grid';
    $('#app').style.display = user ? 'block' : 'none';
    if (unsub) { unsub(); unsub = null; }
    if (user) listen();
  });

  /* ---------- Son ---------- */
  let soundOn = true, audio;
  $('#sound').onclick = () => { soundOn = !soundOn; $('#sound').textContent = soundOn ? '🔔 Son activé' : '🔕 Son coupé'; if (soundOn) beep(); };
  function beep(){
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [0, .18].forEach((t, i) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = [660, 990][i];
        g.gain.setValueAtTime(.25, audio.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .25);
        o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .25);
      });
    } catch {}
  }

  /* ---------- Réservations en direct ---------- */
  let resas = [], first = true, selected = ymd(new Date()), added = [];
  function listen(){
    const q = query(collection(db, 'reservations'), where('date', '>=', ymd(new Date())), orderBy('date'));
    unsub = onSnapshot(q, snap => {
      $('#live').classList.remove('off'); $('#live span').textContent = 'En direct';
      added = first ? [] : snap.docChanges().filter(c => c.type === 'added').map(c => c.doc.id);
      resas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
      if (added.length) {
        beep();
        const r = resas.find(x => x.id === added[added.length - 1]);
        const d = new Date(r.date + 'T00:00');
        toast(`✂️ Nouveau RDV : ${r.name}, ${JOURS[d.getDay()]} ${d.getDate()} à ${r.time.replace(':', ' h ')}`);
      }
      first = false;
    }, err => {
      console.error(err);
      $('#live').classList.add('off'); $('#live span').textContent = 'Connexion perdue';
    });
  }

  function render(){
    const today = ymd(new Date());
    const active = r => r.status !== 'absent';
    // Statistiques
    const todays = resas.filter(r => r.date === today && active(r));
    $('#s-today').textContent = todays.length;
    $('#s-money').textContent = todays.reduce((s, r) => s + Number(r.price || 0), 0) + ' $';
    $('#s-week').textContent = resas.filter(r => r.status === 'confirmee').length;

    // Barre des 14 jours
    const days = Array.from({length: 14}, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
    $('#days').innerHTML = days.map((d, i) => {
      const key = ymd(d), n = resas.filter(r => r.date === key && r.status === 'confirmee').length;
      return `<button class="day${key === selected ? ' on' : ''}" data-date="${key}" ${SCHEDULE[d.getDay()] ? '' : 'style="opacity:.35"'}>
        <small>${i === 0 ? 'Auj.' : i === 1 ? 'Dem.' : JOURS[d.getDay()]}</small><b>${d.getDate()}</b>${n ? `<span class="n">${n}</span>` : ''}</button>`;
    }).join('');

    // Liste du jour choisi
    const sd = new Date(selected + 'T00:00');
    $('#day-name').textContent = selected === today ? "Aujourd'hui" : sd.toLocaleDateString('fr-CA', {weekday:'long', day:'numeric', month:'long'});
    const list = resas.filter(r => r.date === selected).sort((a, b) => a.time.localeCompare(b.time));
    $('#day-count').textContent = SCHEDULE[sd.getDay()]
      ? `${list.filter(active).length} rendez-vous · ${SCHEDULE[sd.getDay()][0]} h – ${SCHEDULE[sd.getDay()][1]} h`
      : 'Fermé';
    const nowT = `${String(new Date().getHours()).padStart(2,'0')}:${String(new Date().getMinutes()).padStart(2,'0')}`;
    const next = selected === today ? list.find(r => r.status === 'confirmee' && r.time >= nowT) : null;

    $('#list').innerHTML = list.length ? list.map(r => {
      const end = (() => { const m = Number(r.time.slice(0,2)) * 60 + Number(r.time.slice(3)) + Number(r.duration || 30); return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; })();
      const badge = r.status === 'terminee' ? '<span class="badge terminee">Terminé</span>'
                  : r.status === 'absent' ? '<span class="badge absent">Absent</span>'
                  : next && next.id === r.id ? '<span class="badge next">Prochain</span>' : '';
      const actions = r.status === 'confirmee'
        ? `<button class="act done" data-id="${r.id}" data-s="terminee">✓ Terminé</button>
           <button class="act abs" data-id="${r.id}" data-s="absent">Absent</button>
           <button class="act del" data-del="${r.id}">Annuler</button>`
        : `<button class="act" data-id="${r.id}" data-s="confirmee">↺ Rétablir</button>`;
      return `<article class="rdv ${r.status}${next && next.id === r.id ? ' next' : ''}${added.includes(r.id) ? ' new' : ''}">
        <div class="time">${esc(r.time.replace(':', 'h'))}<small>→ ${end.replace(':', 'h')}</small></div>
        <div class="who"><b>${esc(r.name)}${badge}</b>
          <span class="svc">${esc(r.service)} · ${Number(r.price)} $ · #${esc(r.ref)}</span><br>
          <a href="tel:${esc(r.phone)}">📞 ${esc(r.phone)}</a></div>
        <div class="actions">${actions}</div>
      </article>`;
    }).join('') : `<div class="empty">${SCHEDULE[sd.getDay()] ? 'Aucun rendez-vous pour ce jour.' : 'Le salon est fermé ce jour-là.'}</div>`;
  }

  $('#days').onclick = e => {
    const b = e.target.closest('.day'); if (!b) return;
    selected = b.dataset.date; added = []; render();
  };

  /* ---------- Actions ---------- */
  document.addEventListener('click', async e => {
    // Changer le statut
    const s = e.target.closest('[data-s]');
    if (s) {
      s.disabled = true;
      try { await updateDoc(doc(db, 'reservations', s.dataset.id), { status: s.dataset.s }); }
      catch (err) { console.error(err); toast('Erreur : action impossible.'); s.disabled = false; }
      return;
    }
    // Annuler (2 clics pour confirmer) : supprime le RDV et libère ses créneaux
    const d = e.target.closest('[data-del]');
    if (d) {
      if (!d.classList.contains('sure')) {
        d.classList.add('sure'); d.textContent = 'Confirmer ?';
        setTimeout(() => { d.classList.remove('sure'); d.textContent = 'Annuler'; }, 3000);
        return;
      }
      const r = resas.find(x => x.id === d.dataset.del);
      try {
        const batch = writeBatch(db);
        batch.delete(doc(db, 'reservations', r.id));
        (r.slots || [r.time]).forEach(t => batch.delete(doc(db, 'busy', `${r.date}_${t}`)));
        await batch.commit();
        toast('Rendez-vous annulé, le créneau est de nouveau libre.');
      } catch (err) { console.error(err); toast('Erreur : annulation impossible.'); }
    }
  });

  setInterval(() => { added = []; if (resas.length) render(); }, 60000);

  function toast(t){
    const el = $('#toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
